# allfiles-pi – Projektmetadaten (maschinenlesbar, TOML).
#
# Projekt:     allfiles-pi
# Modul:       project.toml
# Version:     1.5.0
# Stand:       2026-08-22
# Abhaengig:   bash >= 4, OpenSSH-Client (ssh); optional puttygen, sshpass
# Bezug:       requirements.txt (leer – kein Python)
# Lizenz:      MIT
# Upstream:    allfiles.sh / owrtcollect.sh (FFHB / RadioBBS)
# Erstellt mit: Cursor Grok 4.6
# Autor:       (FFHB) / RadioBBS

[projekt]
name = "allfiles-pi"
zweck = "Raspberry-Pi-Daten per SSH sammeln und lokal speichern."
version = "1.5.0"
stand = "2026-08-22"
lizenz = "MIT"
autor = "(FFHB) / RadioBBS"
erstellt_mit = "Cursor Grok 4.6"
upstream = "allfiles.sh / owrtcollect.sh (FFHB / RadioBBS)"
bezug = "requirements.txt (leer – kein Python)"
abhaengigkeiten = [
    "bash >= 4",
    "OpenSSH-Client (ssh), ping, date, mkdir",
    "optional: puttygen (putty-tools, fuer .ppk)",
    "optional: sshpass (fuer Passwort-Login -P)",
]

[[module]]
pfad = "allfiles-pi.sh"
zweck = "Hauptskript (Sammellauf per SSH)"
shell = "WSL/Linux (bash), Ausfuehrung mit sudo"

[[historie]]
version = "1.0.0"
datum = "2026-08-22"
beschreibung = "Erste Version, allfiles.sh-Schleife fuer Raspberry Pi"

