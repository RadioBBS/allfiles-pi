name: allfiles-pi
description: Raspberry-Pi-Daten per SSH sammeln und lokal speichern.
language: bash
bash_min: "4"
license: MIT
version: "1.5.0"
stand: "2026-08-22"
author: (FFHB) / RadioBBS
upstream: allfiles.sh / owrtcollect.sh (FFHB / RadioBBS)
scripts:
  - allfiles-pi.sh
repository:
  host: github
  owner: RadioBBS
  name: allfiles-pi
  url: https://github.com/RadioBBS/allfiles-pi
  visibility: public
  default_branch: main
standards:
  styleguide: "2.1.0"
  styleguide_file: "%USERPROFILE%\\Documents\\Cursor\\.Security-and-Styleguide\\0-Style‑Guide.txt"
  software_standard: "1.6.0"
  software_standard_file: "%USERPROFILE%\\Documents\\Cursor\\.Security-and-Styleguide\\MY-SOFTWARE-STANDARD v1.0.0.txt"
testing:
  framework: unittest
  command: python -m unittest discover -s tests
  required: true
  live_hosts: false
cli:
  help: [--help, -h]
  version: [--version]
maintenance:
  status: active
  owner: RadioBBS
documentation:
  language: de
security:
  secrets_in_repo: false
  scans_dot_directories: false
machine_readable:
